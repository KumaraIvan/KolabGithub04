<doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <title>Ivan's Terminal</title>
    <link href="./style.css" rel="stylesheet"/>
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="terminal">
      <div class="initial">
        <div class="terminal-line">Welcome to my terminal</div>
        <div class="terminal-line">Type "help" to see a list of available commands.</div>
        <br/>
      </div>
      <div id="output"></div>

      <div id="input">
        <span id="prompt">guest@localhost:~$</span>
        <span class="terminal-input"></span><span class="cursor">█</span>
      </div>
    </div>
  </body>
</html>
